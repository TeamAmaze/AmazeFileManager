apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.mozilla.rust-android-gradle.rust-android'
apply from: "../gradle/setupRustAndroidLocal.gradle"

android {
    namespace "com.amaze.filemanager.fileoperations"
    compileSdkVersion libs.versions.compileSdk.get().toInteger()
    ndkVersion libs.versions.ndk.get()

    defaultConfig {
        minSdkVersion libs.versions.minSdk.get().toInteger()
        ndkVersion libs.versions.ndk.get()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

		multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get().toInteger())
        targetCompatibility JavaVersion.toVersion(libs.versions.jvmTarget.get().toInteger())
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// Rust configuration
cargo {
    module = "./"
    libname = "rootoperations"
    targets = ["arm", "arm64", "x86", "x86_64"]
    profile = "release"
    
    // Optional: Use cargo and rustc from the path
    rustcCommand = "rustc"
    cargoCommand = "cargo"
    pythonCommand = "python3"
}

kotlin {
    jvmToolchain(libs.versions.jvmTarget.get().toInteger())
}

def rustReleaseLibraries = [
        "aarch64-linux-android",
        "armv7-linux-androideabi",
        "i686-linux-android",
        "x86_64-linux-android",
].collect { target -> file("target/${target}/release/librootoperations.so") }
def rustReleaseJniLibraries = [
        "arm64-v8a",
        "armeabi-v7a",
        "x86",
        "x86_64",
].collect { abi -> file("build/rustJniLibs/android/${abi}/librootoperations.so") }

tasks.register("stripRustReleaseDebugSymbols") {
    dependsOn "cargoBuild"

    doLast {
        def llvmStrip = fileTree(new File(android.ndkDirectory, "toolchains/llvm/prebuilt")) {
            include "*/bin/llvm-strip"
            include "*/bin/llvm-strip.exe"
        }.singleFile

        exec {
            commandLine llvmStrip.absolutePath, "--strip-unneeded",
                    *(rustReleaseLibraries + rustReleaseJniLibraries)*.absolutePath
        }
    }
}

// Ensure Rust libraries are built before Android tasks
afterEvaluate {
    android.libraryVariants.all { variant ->
        variant.outputs.all { output ->
            def buildTask = tasks.findByName("cargoBuild")
            if (buildTask) {
                tasks.getByName("merge${variant.name.capitalize()}JniLibFolders").dependsOn buildTask
            }
            if (variant.buildType.name == "release") {
                tasks.getByName("merge${variant.name.capitalize()}JniLibFolders").dependsOn "stripRustReleaseDebugSymbols"
            }
        }
    }
}

dependencies {
    modules {
        module("org.bouncycastle:bcprov-jdk15on") {
            replacedBy("org.bouncycastle:bcprov-jdk18on")
        }
        module("org.bouncycastle:bcpkix-jdk15on") {
            replacedBy("org.bouncycastle:bcpkix-jdk18on")
        }
        module("org.bouncycastle:bcprov-jdk15to18") {
            replacedBy("org.bouncycastle:bcprov-jdk18on")
        }
        module("org.bouncycastle:bcpkix-jdk15to18") {
            replacedBy("org.bouncycastle:bcpkix-jdk18on")
        }
    }

    implementation libs.commons.compress

    //zip4j: support password-protected zips
    implementation libs.zip4j

    implementation project(':commons_compress_7z')

    //SFTP
    implementation libs.sshj

    //smb
    implementation libs.jcifs.ng

    implementation libs.androidX.multidex //Multiple dex files

    //TODO some libs are not needed

    //For tests
    testImplementation project(':testShared')
    testImplementation libs.junit //tests the app logic
    testImplementation libs.robolectric //tests android interaction
    testImplementation libs.robolectric.shadows.httpclient //tests android interaction
    testImplementation libs.androidX.test.core
    testImplementation libs.androidX.test.runner
    testImplementation libs.androidX.test.rules
    testImplementation libs.androidX.test.ext.junit
    //testImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    testImplementation libs.mockito.core
    testImplementation libs.apache.sshd
    testImplementation libs.awaitility
    testImplementation libs.jsoup
    kspTest libs.auto.service

    androidTestImplementation libs.junit //tests the app logic
    androidTestImplementation libs.androidX.test.expresso
    androidTestImplementation libs.androidX.test.core
    androidTestImplementation libs.androidX.test.runner
    androidTestImplementation libs.androidX.test.rules
    androidTestImplementation libs.androidX.test.ext.junit
    androidTestImplementation libs.commons.net
    androidTestImplementation libs.awaitility

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.androidX.appcompat
}

tasks.matching {
    it.name.startsWith('cargoBuild')
}.configureEach {
    it.dependsOn 'setupRustAndroidLocal'
}