apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.amaze.filemanager.ftpserver"
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                // Required for Mockito to work with Java 21
                jvmArgs '-Dnet.bytebuddy.experimental=true'
                jvmArgs '-XX:+EnableDynamicAgentLoading'
            }
        }
    }
}

dependencies {
    implementation project(":server-core")

    implementation libs.androidX.core
    implementation libs.androidX.appcompat
    implementation libs.androidX.fragment
    implementation libs.androidX.preference
    implementation libs.androidX.cardview
    implementation libs.androidX.constraintLayout
    implementation libs.androidX.material
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation libs.apache.mina.core
    implementation libs.apache.ftpserver.ftplet.api
    implementation libs.apache.ftpserver.core

    implementation libs.slf4j.api
    implementation libs.materialdialogs.core
    implementation libs.materialdialogs.commons

    // Kotlin coroutines for Flow
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Root filesystem support
    implementation libs.libsu.core
    implementation libs.libsu.io

    testImplementation libs.junit
    testImplementation libs.mockk
    testImplementation libs.mockito.core
    testImplementation libs.mockito.inline
    testImplementation libs.androidX.test.core
    testImplementation libs.androidX.test.ext.junit

    androidTestImplementation libs.androidX.test.ext.junit
    androidTestImplementation libs.androidX.test.expresso
}