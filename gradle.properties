# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
android.enableJetifier=true
android.useAndroidX=true

org.gradle.jvmargs=-Xmx4608M -XX:+UseParallelGC \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Android Studio may use a newer bundled JDK (e.g., Java 21) to run Gradle.
# This project uses Gradle 7.4.2, which requires running on Java <= 17.
# Point Gradle explicitly to a Java 17 install directory on Windows.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17


# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# https://github.com/usefulness/easylauncher-gradle-plugin/issues/408
android.disableResourceValidation=true
# Newer NDKs don't support API < 21; this project still targets minSdk 19.
# Suppress the NDK minSdk check so the project can configure/build.
android.ndk.suppressMinSdkVersionError=21
# for macs, omit for other operating systems
# org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
