name: Android Feature CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'master'
      - 'release/*'
      - 'hotfix/*'

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_spotless:
    name: Check spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
          local-cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting using spotless
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew spotlessCheck --stacktrace

  build:
    name: Build debug and run Jacoco tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Verify Rust setup
        run: |
          cd file_operations
          echo "🔍 Verifying Rust Android targets..."
          rustup target list --installed | grep android || echo "No Android targets found"
          echo "🔍 Verifying cargo configuration..."
          if [ -f .cargo/config.toml ]; then
            echo "✅ .cargo/config.toml exists"
          else
            echo "❌ .cargo/config.toml missing"
            exit 1
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew assembledebug --stacktrace
      - name: Run test cases
        run: ./gradlew jacocoTestPlayDebugUnitTestReport --stacktrace --info
      # 1. ขั้นตอนการบิลด์ APK แบบจัดเต็ม (ระบุ Flavor ให้ตรงกับ Test)
      - name: 🔨 Build Debug APK
        run: ./gradlew assemblePlayDebug --stacktrace
      # 2. ขั้นตอนการดึงไฟล์ APK มาแพ็กเป็น Artifact ให้เราดาวน์โหลด
      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazeFileManager-Debug-APK
          # ใช้ Wildcard (**) เพื่อกวาดหาไฟล์ .apk ทุกตัวในโฟลเดอร์ outputs ไม่ว่ามันจะซ้อนอยู่ในโฟลเดอร์ flavor ไหนก็ตาม
          path: app/build/outputs/apk/**/*.apk
          # ตั้งค่าให้เก็บไฟล์ไว้กี่วัน (แนะนำ 7 วันเพื่อไม่ให้เปลืองพื้นที่ GitHub มากเกินไป)
          retention-days: 7
          # ถ้าหาไฟล์ไม่เจอ ให้แจ้ง Error ทันที จะได้รู้ตัวว่าบิลด์พัง
          if-no-files-found: error
          
