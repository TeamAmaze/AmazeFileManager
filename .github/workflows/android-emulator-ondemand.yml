name: Android Emulator On-Demand

on:
  workflow_dispatch:
    inputs:
      api-levels:
        description: 'API levels to test (comma-separated, e.g. "23,28")'
        required: false
        default: '23,28'
        type: string

jobs:
  test_emulator:
    timeout-minutes: 30 # Emulator can get stuck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        api-level: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('[{0}]', inputs.api-levels)) }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
      - name: Set up NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r30
          link-to-sdk: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Verify Rust setup
        run: |
          cd file_operations
          echo "🔍 Verifying Rust Android targets..."
          rustup target list --installed | grep android || echo "No Android targets found"
          echo "🔍 Verifying cargo configuration..."
          if [ -f .cargo/config.toml ]; then
            echo "✅ .cargo/config.toml exists"
          else
            echo "❌ .cargo/config.toml missing"
            exit 1
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-${{ matrix.api-level }}
      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          sdcard-path-or-size: 100M
          arch: x86_64
          ram-size: 2048M
          channel: canary
          script: echo "Generated AVD snapshot for caching."
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          sdcard-path-or-size: 100M
          arch: x86_64
          ram-size: 2048M
          channel: canary
          # We have to explicitly set the parameters to disable animations (probably due to a bug)
          script: |
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0
            
            adb logcat -c
            adb logcat *:E &
            ./gradlew :app:connectedCheck
      - name: Print test failures
        # Print errors without having them cut off (as the logs sometimes do)
        if: failure()
        shell: python3 {0}
        run: |
          import glob
          import xml.etree.ElementTree as ET

          paths = glob.glob("app/build/outputs/androidTest-results/**/TEST-*.xml", recursive=True)
          if not paths:
              print("No androidTest result XML found (did the build fail before the tests ran?)")
          for path in paths:
              for case in ET.parse(path).iter("testcase"):
                  for problem in case.findall("failure") + case.findall("error"):
                      print(f"=== {case.get('classname')}.{case.get('name')}")
                      print(problem.text or problem.get("message"))