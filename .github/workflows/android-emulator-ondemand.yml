name: Android Emulator On-Demand

on:
  workflow_dispatch:
    inputs:
      api-levels:
        description: 'API levels to test (comma-separated, e.g. "23,28")'
        required: false
        default: '23,28'
        type: string
      record-video:
        description: 'Record the emulator screen and upload it as an artifact kept for 1 day'
        required: false
        default: false
        type: boolean

jobs:
  test_emulator:
    timeout-minutes: 30 # Emulator can get stuck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        api-level: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('[{0}]', inputs.api-levels)) }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
      - name: Set up NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: r30
          link-to-sdk: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            file_operations/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Setup Rust for Android
        run: |
          cd file_operations
          chmod +x setup_rust_android.sh
          ./setup_rust_android.sh
      - name: Verify Rust setup
        run: |
          cd file_operations
          echo "🔍 Verifying Rust Android targets..."
          rustup target list --installed | grep android || echo "No Android targets found"
          echo "🔍 Verifying cargo configuration..."
          if [ -f .cargo/config.toml ]; then
            echo "✅ .cargo/config.toml exists"
          else
            echo "❌ .cargo/config.toml missing"
            exit 1
          fi
      - name: Run emulator tests
        uses: ./.github/actions/run-emulator-tests
        with:
          api-level: ${{ matrix.api-level }}
          record-video: ${{ inputs.record-video }}
